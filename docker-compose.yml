version: '3.9'

services:
  # ═══════════════════════════════════════════════════════════
  # CORE GATEWAY & ROUTING
  # ═══════════════════════════════════════════════════════════
  
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c25-orchestrator
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - c25-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════
  
  redis:
    image: redis:7-alpine
    container_name: c25-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - c25-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: c25-postgres
    environment:
      POSTGRES_USER: c25_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_changeme}
      POSTGRES_DB: c25_main
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - c25-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c25_admin"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # PLANETARY AGENTS (25 Total)
  # Each agent handles specific domain
  # ═══════════════════════════════════════════════════════════

  # EARTH - Infrastructure & Structure
  agent-earth:
    build:
      context: ./agents/earth
      dockerfile: Dockerfile
    container_name: c25-agent-earth
    environment:
      AGENT_ID: earth
      AGENT_ROLE: infrastructure
      ORCHESTRATOR_URL: http://orchestrator:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - c25-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 10s
      timeout: 5s
      retries: 2
    restart: unless-stopped

  # MARS - Security & Authentication
  agent-mars:
