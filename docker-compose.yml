      AGENT_ID: mars
      AGENT_ROLE: security
      ORCHESTRATOR_URL: http://orchestrator:8000
      REDIS_URL: redis://redis:6379
      BIOMETRIC_API_KEY: ${BIOMETRIC_API_KEY}
    depends_on:
      orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - c25-network
